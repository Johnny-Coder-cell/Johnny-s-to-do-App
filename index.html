<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>"MY To-do LIST"</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="todo-app">
      <h1>Johnny's To-do List</h1>

      <section class="todo-input-section">
        <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="Add a new task" />
        <button id="addTaskButton" type="button">Add Task</button>
      </section>

      <ul id="taskList" aria-live="polite"></ul>

      <footer class="todo-footer">
        <span id="taskCount">0 tasks left</span>
        <div class="filters" aria-label="Task filters">
          <button class="filter-btn active" type="button" data-filter="all">All</button>
          <button class="filter-btn" type="button" data-filter="active">Active</button>
          <button class="filter-btn" type="button" data-filter="completed">Completed</button>
        </div>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
